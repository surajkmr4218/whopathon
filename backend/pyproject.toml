[project]
name = "subswipe-backend"
version = "0.1.0"
description = "SubSwipe FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "email-validator>=2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
